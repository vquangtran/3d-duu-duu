<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chợ 3D Duu Duu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="Khu chợ 3D. Kéo một ngón để đi, chạm vào quần áo để xem."></canvas>
  <div id="tags"></div>
  <div id="hud" hidden>
    <div class="top">
      <button class="chip" id="room" aria-haspopup="dialog"><b id="roomName">Chợ đêm</b><i>Phòng 1</i>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
      <div class="topR">
        <span class="chip ppl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.6-3.800 3-6 6-6s5.400 2.200 6 6"/><path d="M16 5a3.500 3.500 0 0 1 0 6.600M18 14.400c1.700.8 2.700 2.800 3 5.600"/></svg>46</span>
        <button class="chip cart" id="cart">Giỏ · <span id="cartN">0</span></button>
      </div>
    </div>
    <div id="ticker" role="status"></div>
    <div id="hint"></div>
    <div id="strip" hidden><p id="stripT"></p><div id="cards"></div></div>
    <nav id="nav" aria-label="Đi tới"></nav>
    <div id="joy" hidden aria-hidden="true"><div id="knob"></div></div>
    <div id="acts">
      <button data-a="wave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5.500a1.500 1.500 0 0 1 3 0V11m0-1V4a1.500 1.500 0 0 1 3 0v7m0-5.500a1.500 1.500 0 0 1 3 0V12m0-3.500a1.500 1.500 0 0 1 3 0V15a7 7 0 0 1-7 7c-3 0-4.500-1.300-6-3.500L3.500 14c-.8-1.200 1-3 2.300-1.700L8 14.500"/></svg>Vẫy tay</button>
      <button data-a="heart"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.600 4.600 0 0 1 8-3 4.600 4.600 0 0 1 8 3c0 6-8 11-8 11z"/></svg>Thả tim</button>
      <button data-a="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M9.500 9a2.500 2.500 0 1 1 3.500 2.300c-.7.300-1 .7-1 1.200"/></svg>Hỏi size</button>
    </div>
  </div>
  <div id="fade"></div>

  <div class="scrim" id="sheetWrap" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sName">
      <button class="close" data-close aria-label="Đóng"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <canvas class="hero" id="sThumb" aria-hidden="true"></canvas>
      <div><header><h2 id="sName"></h2><p class="price" id="sPrice"></p></header><p class="sub" id="sLook"></p></div>
      <h3>Chọn size theo cân nặng</h3>
      <div class="sizes" id="sizes"></div>
      <div class="row"><button class="btn ghost" id="tryOn">Cho bé mặc thử</button><button class="btn main" id="buy">Chốt đơn</button></div>
    </section>
  </div>

  <div class="scrim" id="roomWrap" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="rTitle">
      <button class="close" data-close aria-label="Đóng"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="rTitle">Đi đến đâu?</h2>
      <div class="rooms" id="rooms"></div>
    </section>
  </div>

  <div id="intro">
    <form id="enter">
      <h1>Duu Duu họp chợ</h1>
      <p>Dẫn bé đi dạo chợ đêm, ghé từng sạp và vào cửa hàng xem đồ mới.</p>
      <label>Tên hiện trong chợ<input id="who" type="text" maxlength="16" value="Bé Bống" autocomplete="off"></label>
      <button class="btn main" type="submit">Vào chợ</button>
      <p class="demo">Bản minh hoạ: người trong chợ, tồn kho và số liệu đều là mẫu.</p>
    </form>
  </div>
  <div id="load">Đang dựng chợ…</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="src/main.js"></script>
</body>
</html>
