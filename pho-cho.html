<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phố chợ DuuDuu</title>
<meta name="description" content="Phố chợ DuuDuu nhìn từ trên cao: chạm vào từng sạp để xem mẫu, giá và size cho bé.">
<link rel="icon" type="image/png" href="anh/logo-64.png">
<link rel="apple-touch-icon" href="anh/logo-180.png">
<link rel="preload" href="fonts/baloo-2-latin-4a324d.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/baloo-2-vietnamese-016797.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/fonts.css">
<link rel="stylesheet" href="src/pho-cho.css">
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="Phố chợ DuuDuu nhìn từ trên cao. Kéo để xoay, chạm vào sạp để xem mẫu."></canvas>
  <div id="tags" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><img src="anh/logo-64.png" alt=""><div><b>Phố chợ DuuDuu</b><span>Mở cả ngày cho mẹ và bé</span></div></div>
  </header>
  <p id="hint">Kéo để xoay phố · chạm vào sạp để xem mẫu</p>
  <a class="go" href="index.html">Vào chợ dạo sạp<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>

  <div class="scrim" id="sheetWrap" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sTen">
      <button class="close" id="sClose" aria-label="Đóng"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="sTen"></h2>
      <p class="sub" id="sSub"></p>
      <ul class="list" id="sList"></ul>
      <a class="btn" href="index.html">Vào chợ xem kỹ, chọn size</a>
    </section>
  </div>
  <div id="load"><img src="anh/logo.png" alt="DuuDuu"><span>Đang dựng phố chợ…</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data/san-pham.js"></script>
<script src="src/pho-cho.js"></script>
</body>
</html>
